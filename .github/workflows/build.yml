name: Railcraft CI

on:
  push:
    branches:
    - 1.21.x
  pull_request:
    branches:
    - 1.21.x
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew runGameTestServer

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Railcraft-1.21.x-GitHub
          path: build/libs
